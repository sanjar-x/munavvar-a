# Файл: .pre-commit-config.yaml
# Эта конфигурация автоматически проверяет и форматирует код перед каждым git commit

repos:
  # 1. БАЗОВЫЕ ПРОВЕРКИ (От самого Git и сообщества)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0 # Версия базовых хуков
    hooks:
      - id: trailing-whitespace # Удаляет лишние пробелы в конце строк
      - id: end-of-file-fixer # Добавляет пустую строку в конец файлов (стандарт POSIX)
      - id: check-yaml # Проверяет, что все .yaml файлы валидны
      - id: check-added-large-files # Запрещает коммитить огромные файлы (случайные дампы БД)
      - id: check-merge-conflict # Проверяет, не забыл ли ты разрешить конфликты слияния
      - id: detect-private-key # 🛡 СЕКЬЮРИТИ: Ищет случайно забытые приватные ключи и пароли

  # 2. СВЕРХБЫСТРЫЙ ЛИНТЕР И ФОРМАТТЕР (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1 # Версия Ruff (pre-commit сам её скачает)
    hooks:
      # Запуск линтера (находит неиспользуемые переменные, плохие импорты)
      # Флаг --fix заставляет Ruff попытаться исправить ошибки автоматически
      - id: ruff
        args: [--fix]
      # Запуск форматтера (делает код красивым, выравнивает кавычки и отступы)
      - id: ruff-format

  # 3. СИНХРОНИЗАЦИЯ API-CHANGELOG С ПУБЛИЧНЫМ КОНТРАКТОМ
  # Если меняются публичные контракты (роуты, схемы, enums, миграции),
  # коммит должен содержать правку /CHANGELOG.md. Также проверяет, что
  # frontend/CHANGELOG.md — symlink на ../CHANGELOG.md.
  - repo: local
    hooks:
      - id: check-changelog-sync
        name: Sync API CHANGELOG.md with public contract changes
        entry: scripts/check-changelog-sync.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
