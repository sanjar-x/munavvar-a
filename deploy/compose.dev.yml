services:
  postgres:
    image: postgres:18-alpine
    container_name: dev_postgres
    restart: unless-stopped
    stop_signal: SIGINT

    networks:
      - munavvar_network

    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

    shm_size: 512mb

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-munavvar_a}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-munavvar_a}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "logging_collector=off"
networks:
  munavvar_network:
    driver: bridge

volumes:
  postgres_data:
