services:
  fastapi:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: fastapi
    restart: unless-stopped
    networks:
      - network
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      PGHOST: "postgres"
      PGPORT: 5432
      PGUSER: "${POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB}"
    volumes:
      - ..:/app
    command: >
      sh -c "uv run alembic upgrade head && 
             uv run fastapi dev src/main.py --host 0.0.0.0"

networks:
  network:
    external: true
    name: network
