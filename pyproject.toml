[project]
name = "munavvar-a"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.132.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pyjwt>=2.11.0",
    "sqlalchemy[asyncio]>=2.1.0b1",
    "structlog>=25.5.0",
    "structlog-config>=0.11.0",
]

[tool.ruff]
line-length = 79
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["UP037"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pyclean>=3.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]

[tool.pytest.ini_options]
# Автоматически запускать все async-тесты
asyncio_mode = "auto"
# Устанавливаем область видимости event_loop на сессию (требование новых версий)
asyncio_default_fixture_loop_scope = "session"
# Указываем папку с тестами
testpaths = ["tests"]
