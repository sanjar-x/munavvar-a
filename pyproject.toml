[project]
name = "munavvar-a"
version = "0.1.0"
description = "B2B/B2C water delivery management platform (HOD)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.132.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pyjwt>=2.11.0",
    "sqlalchemy[asyncio]>=2.1.0b1",
    "structlog>=25.5.0",
    "structlog-config>=0.11.0",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 79
target-version = "py314"
fix = true
unsafe-fixes = false
show-fixes = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "PERF", # perflint
]
ignore = [
    "UP037",  # `X | Y` union syntax — conflicts with some SQLAlchemy patterns
    "N818",   # AppException base class intentionally named with *Exception suffix
    "N805",   # `cls` in declared_attr.directive — SQLAlchemy false positive
    "RET504", # Assignment before return — improves readability / debuggability
    "C901",
]
unfixable = [
    "F841", # Local variable assigned but never used — dev should review, not auto-remove
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]
"triggers__backup.py" = ["E501"]
"tests/**" = [
    "PT004", # Fixtures without return value don't need to yield
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── ty (type checker) ─────────────────────────────────────────────────────────

[tool.ty.rules]
invalid-return-type = "error"
invalid-argument-type = "warn"

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: fast unit tests without DB",
    "integration: tests that require a database connection",
    "slow: slow or resource-intensive tests",
]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/core/seeder.py",
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# ── Dependencies ──────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.43.3",
    "polyfactory>=3.3.0",
    "pre-commit>=4.5.1",
    "pyclean>=3.5.0",
    "pytest>=9.0.2",
    "pytest-archon>=0.0.7",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]
